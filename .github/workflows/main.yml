name: Run REST Assured test cases

on:
  push:
    branches: ["main"]

jobs:
    test:
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            java-version: "23.0.1"
            distribution: "temurin"
            cache: maven
        - run: mvn clean test






